name: Build unsigned IPA

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChromaCascade-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30

      # A green compile does not mean the game runs. This boots it in a
      # simulator, lets it play itself and screenshots the result.
      - name: Runtime smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChromaCascade-screenshots
          path: build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
