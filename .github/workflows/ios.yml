name: Build unsigned IPA

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Also boot the app in a simulator and capture screenshots"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChromaCascade-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30

  # Booting a simulator costs several minutes of wall clock, and macOS runner
  # minutes bill at 10x on a private repo — so this is opt-in
  # (Actions → Build unsigned IPA → Run workflow) rather than running on every
  # push. The IPA job above stays fast enough to run every time.
  smoke-test:
    name: Runtime smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Boot the app and capture screenshots
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChromaCascade-screenshots
          path: build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
